[project]
name = "hoho"
version = "0.1.0"
description = "A modern Python debugger TUI"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hoho"]
include = [
    "cmd/**/*",
    "ui/**/*",
    "client/**/*",
    "go.mod",
    "go.sum",
]

[tool.ruff]
target-version = "py38"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "W",  # pycodestyle warnings
]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
